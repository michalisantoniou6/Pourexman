<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#201450">
  <title>Pourexman — a little maze adventure</title>
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand"><span class="brand-face" aria-hidden="true">●</span><div><h1>Pourexman</h1><p>A little maze adventure</p></div></div>
      <button id="soundButton" class="small-button" type="button" aria-pressed="true">♫ Music on</button>
    </header>

    <section class="game-shell" aria-label="Pourexman game">
      <div class="progress" aria-live="polite"><span id="progressText">Find the colorful stars!</span><span id="starsCount">⭐ 0</span></div>
      <div id="starTrail" class="star-trail" aria-label="Stars to find"></div>
      <div class="canvas-wrap"><canvas id="game" width="704" height="576" aria-label="Maze game. Use the keyboard arrow keys to collect colorful stars."></canvas>
        <div id="overlay" class="overlay"><div class="overlay-card"><div class="hero" aria-hidden="true">🟡 ⭐ 👻</div><h2>Let’s play!</h2><p>Press the arrow keys to move!</p><div class="key-guide" aria-label="Keyboard arrow keys"><kbd>↑</kbd><div><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></div></div><button id="startButton" class="primary-button" type="button">♫ Play!</button></div></div>
        <div id="colorCue" class="color-cue" aria-hidden="true"></div>
      </div>
      <p id="message" class="message" aria-live="polite">Find the stars and say their colors!</p>
      <div class="footer-actions"><span>Arrow keys • Find colors • Count stars</span></div>
    </section>
  </main>
  <script src="game.js?v=5"></script>
</body>
</html>
